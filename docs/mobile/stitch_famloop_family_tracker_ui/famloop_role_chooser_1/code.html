<html class="h-full bg-background" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

m", "margin": "1rem", "margin-desktop": "2rem" }, "fontFamily": { "display-lg": ["Inter"], "body-lg": ["Inter"], "label-lg": ["Inter"], "headline-sm": ["Inter"], "title-lg": ["Inter"], "headline-md": ["Inter"], "display-lg-mobile": ["Inter"], "body-md": ["Inter"], "label-sm": ["Inter"], "headline-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "title-md": ["Inter"], "body-sm": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "display-lg": ["44px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "700" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-lg-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }] } } } }</style><style>@layer base{html,body{margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-background text-on-surface font-body-md text-body-md antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-space-md pb-space-xl">
  <!-- Subtle Top Decorative Aura -->
  <div class="relative w-full pt-space-md pb-space-sm flex flex-col items-center text-center">
    <!-- Brand Loop Badge -->
    <div class="inline-flex items-center gap-space-xs px-space-md py-1.5 rounded-full bg-surface-container shadow-sm mb-space-md">
      <span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">all_inclusive</span>
      <span class="font-label-md text-label-md text-primary tracking-wider uppercase font-semibold">FamLoop Secure Circle</span>
    </div>

    <!-- Onboarding Illustration Image -->
    <div class="w-20 h-20 rounded-full shadow-md overflow-hidden mb-space-md bg-surface-container-high p-0.5">
      <img src="placeholder" data-alt="A modern 3D clay style illustration of a smiling guardian and child connected by glowing cyan orbital rings, high fidelity soft daylight, blue and electric cyan color accents on crisp porcelain white." class="w-full h-full object-cover rounded-full" />
    </div>

    <!-- Typography -->
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-space-xs">Welcome to FamLoop</h1>
    <p class="font-body-md text-body-md text-on-surface-variant max-w-xs">
      Choose how this device will be configured in your family circle.
    </p>
  </div>

  <!-- Role Selection Interactive Stack -->
  <div class="flex flex-col gap-space-md my-space-md" role="radiogroup" aria-label="Select Device Role">
    
    <!-- Option 1: Parent / Guardian Card -->
    <div id="role-parent" onclick="selectRole('parent')" class="role-card relative cursor-pointer rounded-2xl p-space-lg bg-surface-container-lowest shadow-md transition-all duration-200" style="border-radius: 20px;">
      <!-- Selection Indicator Ribbon / Accent Background -->
      <div class="flex items-start justify-between gap-space-sm mb-space-sm">
        <div class="flex items-center gap-space-sm">
          <div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary shadow-sm">
            <span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">security</span>
          </div>
          <div>
            <div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-primary-container/10 text-primary mb-1">
              <span class="font-label-sm text-label-sm uppercase font-bold tracking-wide">Full Circle Control</span>
            </div>
            <h2 class="font-title-lg text-title-lg text-on-surface">Parent / Guardian</h2>
          </div>
        </div>

        <!-- Custom Accessible Radio Control (48x48 min touch area) -->
        <div class="w-12 h-12 flex items-center justify-center -mr-space-sm -mt-space-xs">
          <div id="radio-parent" class="w-6 h-6 rounded-full bg-primary flex items-center justify-center transition-all duration-150">
            <div class="w-2.5 h-2.5 rounded-full bg-surface-container-lowest"></div>
          </div>
        </div>
      </div>

      <p class="font-body-sm text-body-sm text-on-surface-variant mb-space-md">
        Master control panel to oversee safety zones, track telemetry, and protect circle members.
      </p>

      <!-- Key Permissions Grid / Pills -->
      <div class="grid grid-cols-2 gap-space-xs pt-space-xs">
        <div class="flex items-center gap-2 p-2 rounded-xl bg-surface-container-low text-on-surface">
          <span class="material-symbols-outlined text-primary text-[18px]">near_me</span>
          <span class="font-label-md text-label-md truncate">Live map tracking</span>
        </div>
        <div class="flex items-center gap-2 p-2 rounded-xl bg-surface-container-low text-on-surface">
          <span class="material-symbols-outlined text-primary text-[18px]">notification_important</span>
          <span class="font-label-md text-label-md truncate">Geofence alerts</span>
        </div>
        <div class="flex items-center gap-2 p-2 rounded-xl bg-surface-container-low text-on-surface">
          <span class="material-symbols-outlined text-primary text-[18px]">battery_charging_full</span>
          <span class="font-label-md text-label-md truncate">Battery telemetry</span>
        </div>
        <div class="flex items-center gap-2 p-2 rounded-xl bg-surface-container-low text-on-surface">
          <span class="material-symbols-outlined text-primary text-[18px]">speed</span>
          <span class="font-label-md text-label-md truncate">Transit & speed info</span>
        </div>
      </div>
    </div>

    <!-- Option 2: Child / Member Card -->
    <div id="role-child" onclick="selectRole('child')" class="role-card relative cursor-pointer rounded-2xl p-space-lg bg-surface-container-lowest shadow-sm opacity-90 transition-all duration-200" style="border-radius: 20px;">
      <div class="flex items-start justify-between gap-space-sm mb-space-sm">
        <div class="flex items-center gap-space-sm">
          <div class="w-12 h-12 rounded-xl bg-surface-container-low flex items-center justify-center text-secondary shadow-sm">
            <span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">family_restroom</span>
          </div>
          <div>
            <div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed mb-1">
              <span class="font-label-sm text-label-sm uppercase font-bold tracking-wide">Privacy & Battery Savvy</span>
            </div>
            <h2 class="font-title-lg text-title-lg text-on-surface">Child / Member</h2>
          </div>
        </div>

        <!-- Accessible Radio Control (48x48 min touch area) -->
        <div class="w-12 h-12 flex items-center justify-center -mr-space-sm -mt-space-xs">
          <div id="radio-child" class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center transition-all duration-150">
            <div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
          </div>
        </div>
      </div>

      <p class="font-body-sm text-body-sm text-on-surface-variant mb-space-md">
        Lightweight spatial beacon tailored for all-day battery life, mutual trust, and rapid SOS.
      </p>

      <!-- Permissions / Highlights -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center gap-2.5 py-1.5 px-2 rounded-lg bg-surface-container-lowest">
          <span class="material-symbols-outlined text-secondary text-[20px]">share_location</span>
          <span class="font-body-sm text-body-sm text-on-surface">Location shared with verified circle only</span>
        </div>
        <div class="flex items-center gap-2.5 py-1.5 px-2 rounded-lg bg-surface-container-lowest">
          <span class="material-symbols-outlined text-secondary text-[20px]">eco</span>
          <span class="font-body-sm text-body-sm text-on-surface">Adaptive low-power background beacon</span>
        </div>
        <div class="flex items-center gap-2.5 py-1.5 px-2 rounded-lg bg-surface-container-lowest">
          <span class="material-symbols-outlined text-error text-[20px]" style="font-variation-settings: 'FILL' 1;">e911_emergency</span>
          <span class="font-body-sm text-body-sm font-semibold text-on-surface">Instant SOS one-tap beacon alert</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Telemetry Reassurance Note -->
  <div class="flex items-center justify-center gap-2 px-space-sm py-2 rounded-full bg-surface-container-low mb-space-lg text-center">
    <span class="material-symbols-outlined text-tertiary text-[18px]">verified_user</span>
    <span class="font-label-sm text-label-sm text-on-surface-variant">End-to-End Encrypted Telemetry • AES-256</span>
  </div>

  <!-- Bottom Actions Stack -->
  <div class="flex flex-col gap-space-sm w-full mt-auto">
    <!-- Primary Continue Action (Minimum 48dp target height) -->
    <button id="cta-button" class="w-full h-12 min-h-[48px] rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2">
      <span id="cta-text">Continue as Parent</span>
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
    </button>

    <!-- Secondary Navigation Link (Minimum 48dp target) -->
    <button class="w-full min-h-[48px] h-12 rounded-full text-primary hover:bg-surface-container-low active:bg-surface-container font-label-md text-label-md transition-colors flex items-center justify-center gap-1.5">
      <span class="material-symbols-outlined text-[18px]">vpn_key</span>
      <span>Have an invite code? Join existing loop</span>
    </button>
  </div>
</div>

<script>
  let activeRole = 'parent';

  function selectRole(role) {
    activeRole = role;
    const parentCard = document.getElementById('role-parent');
    const childCard = document.getElementById('role-child');
    const radioParent = document.getElementById('radio-parent');
    const radioChild = document.getElementById('radio-child');
    const ctaText = document.getElementById('cta-text');

    if (role === 'parent') {
      // Style Parent Active
      parentCard.classList.remove('opacity-90');
      parentCard.classList.add('shadow-md');
      radioParent.className = 'w-6 h-6 rounded-full bg-primary flex items-center justify-center transition-all duration-150';
      radioParent.children[0].className = 'w-2.5 h-2.5 rounded-full bg-surface-container-lowest';

      // Style Child Inactive
      childCard.classList.add('opacity-90');
      childCard.classList.remove('shadow-md');
      radioChild.className = 'w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center transition-all duration-150';
      radioChild.children[0].className = 'w-2.5 h-2.5 rounded-full bg-transparent';

      ctaText.innerText = 'Continue as Parent';
    } else {
      // Style Child Active
      childCard.classList.remove('opacity-90');
      childCard.classList.add('shadow-md');
      radioChild.className = 'w-6 h-6 rounded-full bg-primary flex items-center justify-center transition-all duration-150';
      radioChild.children[0].className = 'w-2.5 h-2.5 rounded-full bg-surface-container-lowest';

      // Style Parent Inactive
      parentCard.classList.add('opacity-90');
      parentCard.classList.remove('shadow-md');
      radioParent.className = 'w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center transition-all duration-150';
      radioParent.children[0].className = 'w-2.5 h-2.5 rounded-full bg-transparent';

      ctaText.innerText = 'Continue as Child / Member';
    }
  }
</script></head><body></body></html>
